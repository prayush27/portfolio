<style>
  :root {
    --bg: #f4f1ea;
    --ink: #1a1917;
    --soft: #77736b;
    --rule: #dcd7cc;
    --red: #c5050c;
    --pad: clamp(20px, 5vw, 64px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 400 16px/1.55 "Inter Tight", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh; display: flex; flex-direction: column;
    padding: 28px var(--pad);
  }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--ink); color: var(--bg); }

  header, footer { display: flex; justify-content: space-between; gap: 16px; font-size: 14px; color: var(--soft); }

  main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 12vh 0; max-width: 1100px; }

  h1 {
    font: 400 clamp(56px, 11vw, 176px)/.92 "Instrument Serif", serif;
    letter-spacing: -.03em; margin-left: -.04em;
    opacity: 0; transform: translateY(12px); animation: in 1s cubic-bezier(.2,.7,0,1) forwards;
  }
  h1 em { font-style: italic; }

  p {
    margin-top: 36px; max-width: 34ch;
    font-size: clamp(19px, 1.8vw, 24px); line-height: 1.4; letter-spacing: -.01em;
    opacity: 0; animation: in 1s .25s cubic-bezier(.2,.7,0,1) forwards;
  }
  p span { color: var(--soft); }

  nav {
    display: flex; flex-wrap: wrap; gap: 8px 28px; margin-top: 36px;
    opacity: 0; animation: in 1s .4s cubic-bezier(.2,.7,0,1) forwards;
  }
  nav a {
    font-size: 17px; padding-bottom: 2px;
    background: linear-gradient(currentColor, currentColor) 0 100% / 100% 1px no-repeat;
    transition: color .25s, background-size .4s cubic-bezier(.2,.7,0,1);
  }
  nav a:hover, nav a:focus-visible { color: var(--red); background-size: 0 1px; background-position: 100% 100%; outline: none; }

  @keyframes in { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    h1, p, nav { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
