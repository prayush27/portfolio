<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prayush Desai</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg: #fafaf9; --text: #1c1917; --muted: #57534e; --line: #e7e5e4; --accent: #c5050c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0c0a09; --text: #f5f5f4; --muted: #a8a29e; --line: #292524; --accent: #f87171; }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font: 16px/1.6 Inter, system-ui, sans-serif;
         min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
  main { max-width: 560px; }
  h1 { font-size: clamp(36px, 8vw, 52px); line-height: 1.1; letter-spacing: -0.02em; margin-bottom: 14px; }
  p { font-size: 18px; color: var(--muted); }
  nav { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 28px; }
  a { color: var(--text); text-decoration: none; border-bottom: 1px solid var(--line); font-weight: 600; }
  a:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
